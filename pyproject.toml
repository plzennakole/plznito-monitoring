[project]
name = "plznito-monitoring"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.format]
# House style: double quotes for human-readable text, single quotes for programmatic strings.
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Flask app: routes register themselves on import, after `app` exists.
"app/__init__.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.13"
files = ["app", "plznito_monitoring", "bikecounters_web", "run_flask.py"]
ignore_missing_imports = true

# Fully typed modules; extend this list as modules get type hints.
[[tool.mypy.overrides]]
module = ["app.*", "plznito_monitoring.*", "run_flask"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
