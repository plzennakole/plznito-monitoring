  /* ── Phone: bottom sheet ── */
  @media (max-width: 768px) {

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function () {
  const CONFIG = /*__MAP_CONFIG__*/null;
  const DAY = 24 * 60 * 60;
  const PERIOD_DAYS = { last_7_days: 7, last_30_days: 30, last_365_days: 365 };
  const HASH_PERIODS = { last_7_days: "7d", last_30_days: "30d", last_365_days: "365d", all_time: "all" };
  const PERIOD_FROM_HASH = { "7d": "last_7_days", "30d": "last_30_days", "365d": "last_365_days", "all": "all_time" };
  const phoneQuery = window.matchMedia("(max-width: 768px)");

  const app = document.getElementById("plznito-app");
  const allStatusKeys = CONFIG.statusOptions.map(function (option) { return option.key; });
  const allCategoryKeys = CONFIG.categoryOptions.map(function (option) { return option.key; });
  const state = {
    time: CONFIG.defaultTimeFilter,
    statuses: new Set(allStatusKeys),
    categories: new Set(allCategoryKeys),
    openId: null,
  };

  // ── Helpers ────────────────────────────────────────────────────────────────
  function escapeHtml(value) {
    const text = value === null || value === undefined ? "" : String(value);
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function colorForStatus(statusId) {
    return CONFIG.statusColors[String(statusId)] || "#6b7280";
  }
  function labelForStatus(statusId) {
    return CONFIG.statusLabels[String(statusId)] || "Stav " + statusId;
  }
  function formatCount(n) {
    return n.toLocaleString("cs-CZ");
  }
  function sameSet(a, b) {
    return a.size === b.length && b.every(function (key) { return a.has(key); });
  }

  // ── Map ────────────────────────────────────────────────────────────────────
  if (!window.L) {
    throw new Error("Leaflet library is not available.");
  }
  const map = L.map("plznito-map", { zoomControl: false, preferCanvas: true }).setView(CONFIG.center, CONFIG.zoom);
  L.control.zoom({ position: "topright" }).addTo(map);
  L.control.scale({ position: "bottomright", imperial: false }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> · data <a href='https://www.plznito.cz/'>plznito.cz</a>",
    maxZoom: 19
  }).addTo(map);

  const renderer = L.canvas({ padding: 0.5 });
  // Cluster markers are added in chunks; anything that needs a marker in the cluster tree waits for this.
  let clusterReady = Promise.resolve();
  let resolveClusterReady = null;
  const displayLayer = CONFIG.useCluster
    ? L.markerClusterGroup({
        chunkedLoading: true,
        chunkProgress: function (processed, total) {
          if (processed === total && resolveClusterReady) {
            resolveClusterReady();
            resolveClusterReady = null;
          }
        },
        showCoverageOnHover: false,
        maxClusterRadius: 60,
        iconCreateFunction: function (cluster) {
          const count = cluster.getChildCount();
          const size = count < 50 ? 34 : count < 500 ? 42 : count < 5000 ? 50 : 58;
          return L.divIcon({
            html: "<div>" + (count >= 1000 ? Math.round(count / 100) / 10 + "k" : count) + "</div>",
            className: "pz-cluster",
            iconSize: [size, size]
          });
        }
      })
    : L.layerGroup();
  displayLayer.addTo(map);

  // ── Popups ─────────────────────────────────────────────────────────────────
  function buildPopupContent(marker) {
    const color = colorForStatus(marker.status_id);
    const estimated = String(marker.date_text || "").indexOf("≈") === 0;
    const dateLabel = (estimated ? "≈ " : "") + new Date(marker.date_ts * 1000).toLocaleDateString("cs-CZ", { timeZone: "Europe/Prague" });
    let html =
      "<h3 class='pz-pop-title'>" + escapeHtml(marker.name || "Bez názvu") + "</h3>" +
      "<div class='pz-pop-meta'>" +
        "<span class='pz-badge' style='--pz-dot:" + color + "'><span class='pz-dot'></span>" +
          escapeHtml(marker.status_label || labelForStatus(marker.status_id)) + "</span>" +
        "<span>" + escapeHtml(marker.category_label) + "</span>" +
        "<span" + (estimated ? " title='Datum vzniku je odhadnuto podle sousedních hlášení.'" : "") + ">" +
          escapeHtml(dateLabel) + "</span>" +
      "</div>";

    if (CONFIG.popupMode === "api" && !marker.detailsLoaded) {
      html += marker.detailsError
        ? "<p class='pz-pop-text'>" + escapeHtml(marker.detailsError) + "</p>"
        : "<div class='pz-skeleton'></div><div class='pz-skeleton'></div><div class='pz-skeleton short'></div>";
    }
    if (CONFIG.popupMode === "full" || marker.detailsLoaded) {
      if ((marker.description || "").trim()) {
        html += "<p class='pz-pop-text'>" + escapeHtml(marker.description) + "</p>";
      }
      if ((marker.solution || "").trim()) {
        html += "<p class='pz-pop-text pz-pop-solution'>" + escapeHtml(marker.solution) + "</p>";
      }
      if (marker.photo_url) {
        html += "<img class='pz-pop-photo' loading='lazy' src='" + escapeHtml(marker.photo_url) + "' alt='Fotografie hlášení'>";
      }
    }
    html += "<a class='pz-pop-link' href='" + escapeHtml(marker.ticket_url) +
      "' target='_blank' rel='noopener noreferrer'>Detail na plznito.cz ↗</a>";
    return html;
  }

  // Leaflet auto-pans a popup only when it opens; it does not know about the floating
  // panel, and API popups grow after their details arrive. Pan so the popup stays visible.
  function keepPopupInView(popup) {
    window.setTimeout(function () {
      const container = popup.getElement();
      if (!container || !popup.isOpen()) return;
      const popupRect = container.getBoundingClientRect();
      const mapRect = map.getContainer().getBoundingClientRect();
      let dx = 0;
      let dy = 0;
      const panel = document.getElementById("plznito-panel");
      if (!app.classList.contains("pz-panel-closed") && !phoneQuery.matches) {
        const panelRect = panel.getBoundingClientRect();
        if (popupRect.top < panelRect.bottom) dx = Math.min(0, popupRect.left - panelRect.right - 12);
      }
      if (popupRect.top < mapRect.top + 12) dy = popupRect.top - mapRect.top - 12;
      if (dx || dy) map.panBy([dx, dy]);
      // A photo loading later makes the popup taller again.
      const photo = container.querySelector("img");
      if (photo && !photo.complete) {
        photo.addEventListener("load", function () { keepPopupInView(popup); }, { once: true });
      }
    }, 0);
  }

  function loadDetails(marker, popup) {
    if (marker.detailsLoaded) {
      return;
    }
    fetch(CONFIG.detailsApiPath + encodeURIComponent(marker.id))
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.json();
      })
      .then(function (details) {
        marker.description = details.description;
        marker.solution = details.solution;
        marker.photo_url = details.photo_url;
        marker.detailsLoaded = true;
        popup.setContent(buildPopupContent(marker));
        keepPopupInView(popup);
      })
      .catch(function () {
        marker.detailsError = "Podrobnosti se nepodařilo načíst.";
        popup.setContent(buildPopupContent(marker));
      });
  }

  const entriesById = new Map();
  const markerEntries = CONFIG.markers.map(function (marker) {
    const markerObj = L.circleMarker([marker.lat, marker.lon], {
      renderer: renderer,
      radius: 6,
      color: "#ffffff",
      weight: 1.5,
      fillColor: colorForStatus(marker.status_id),
      fillOpacity: 0.9
    });
    // Popup HTML is built on open, not for every marker up front.
    // maxHeight: popups grow when API details arrive; long content scrolls instead of leaving the map.
    markerObj.bindPopup(function () { return buildPopupContent(marker); }, {
      maxWidth: 320,
      minWidth: 260,
      maxHeight: Math.max(220, Math.min(420, app.clientHeight - 120))
    });
    markerObj.on("mouseover", function () { markerObj.setRadius(8); });
    markerObj.on("mouseout", function () { markerObj.setRadius(6); });
    markerObj.on("popupopen", function (event) {
      state.openId = marker.id;
      writeHash();
      keepPopupInView(event.popup);
      if (CONFIG.popupMode === "api") {
        loadDetails(marker, event.popup);
      }
    });
    markerObj.on("popupclose", function () {
      if (state.openId === marker.id) {
        state.openId = null;
        writeHash();
      }
    });
    const entry = { marker: marker, markerObj: markerObj };
    entriesById.set(String(marker.id), entry);
    return entry;
  });

  // ── Filters ────────────────────────────────────────────────────────────────
  function matchesTimeFilter(marker, filterValue) {
    if (PERIOD_DAYS[filterValue]) {
      return marker.date_ts >= CONFIG.generatedTs - PERIOD_DAYS[filterValue] * DAY;
    }
    if (filterValue.indexOf("year:") === 0) {
      return String(marker.year) === filterValue.slice(5);
    }
    return true;
  }

  function buildStatusChips() {
    const container = document.getElementById("plznito-filter-status");
    container.innerHTML = "";
    CONFIG.statusOptions.forEach(function (option) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "pz-chip";
      chip.dataset.statusKey = option.key;
      chip.style.setProperty("--pz-dot", colorForStatus(option.key));
      chip.innerHTML = "<span class='pz-dot'></span><span>" + escapeHtml(option.label) +
        "</span><span class='pz-count'></span>";
      chip.addEventListener("click", function () {
        toggle(state.statuses, option.key);
        applyFilters();
      });
      container.appendChild(chip);
    });
  }

  function buildCategoryList() {
    const container = document.getElementById("plznito-filter-category");
    container.innerHTML = "";
    CONFIG.categoryOptions.forEach(function (option, index) {
      const row = document.createElement("div");
      row.className = "pz-cat";
      row.dataset.categoryKey = option.key;
      const inputId = "plznito-category-" + index;
      row.innerHTML =
        "<label for='" + inputId + "'><input type='checkbox' id='" + inputId + "'>" +
        "<span title='" + escapeHtml(option.label) + "'>" + escapeHtml(option.label) + "</span></label>" +
        "<span class='pz-count'></span>" +
        "<button type='button' class='pz-link-btn pz-only' aria-label='Jen kategorie " +
        escapeHtml(option.label) + "'>jen tato</button>";
      row.querySelector("input").addEventListener("change", function () {
        toggle(state.categories, option.key);
        applyFilters();
      });
      row.querySelector(".pz-only").addEventListener("click", function () {
        state.categories = new Set([option.key]);
        applyFilters();
      });
      container.appendChild(row);
    });
  }

  function buildYearSelect() {
    const select = document.getElementById("plznito-filter-year");
    select.innerHTML = "<option value=''>—</option>" + CONFIG.years.slice().reverse().map(function (year) {
      return "<option value='year:" + year + "'>" + year + "</option>";
    }).join("");
    select.addEventListener("change", function () {
      if (select.value) {
        state.time = select.value;
        applyFilters();
      }
    });
    document.querySelectorAll("#plznito-filter-period button").forEach(function (button) {
      button.addEventListener("click", function () {
        state.time = button.dataset.time;
        applyFilters();
      });
    });
  }

  function toggle(set, key) {
    if (set.has(key)) {
      set.delete(key);
    } else {
      set.add(key);
    }
  }

  function applyFilters() {
    const statusCounts = {};
    const categoryCounts = {};
    const shownMarkers = [];
    let inPeriod = 0;

    markerEntries.forEach(function (entry) {
      const marker = entry.marker;
      if (!matchesTimeFilter(marker, state.time)) {
        return;
      }
      inPeriod += 1;
      const statusKey = String(marker.status_id);
      const statusOk = state.statuses.has(statusKey);
      const categoryOk = state.categories.has(marker.category_key);
      // Each facet counts what it would show given the other filters.
      if (categoryOk) statusCounts[statusKey] = (statusCounts[statusKey] || 0) + 1;
      if (statusOk) categoryCounts[marker.category_key] = (categoryCounts[marker.category_key] || 0) + 1;
      if (statusOk && categoryOk) shownMarkers.push(entry.markerObj);
    });

    displayLayer.clearLayers();
    if (CONFIG.useCluster && shownMarkers.length) {
      clusterReady = new Promise(function (resolve) { resolveClusterReady = resolve; });
    }
    // One bulk add lets the cluster group build its tree once instead of per marker.
    if (displayLayer.addLayers) {
      displayLayer.addLayers(shownMarkers);
    } else {
      shownMarkers.forEach(function (markerObj) { displayLayer.addLayer(markerObj); });
    }
    renderControls(statusCounts, categoryCounts, shownMarkers.length, inPeriod);
    writeHash();
  }

  function renderControls(statusCounts, categoryCounts, shownCount, inPeriod) {
    document.querySelectorAll("#plznito-filter-period button").forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.time === state.time));
    });
    const yearSelect = document.getElementById("plznito-filter-year");
    const isYear = state.time.indexOf("year:") === 0;
    yearSelect.value = isYear ? state.time : "";
    yearSelect.classList.toggle("pz-active", isYear);

    document.querySelectorAll("#plznito-filter-status .pz-chip").forEach(function (chip) {
      const key = chip.dataset.statusKey;
      chip.setAttribute("aria-pressed", String(state.statuses.has(key)));
      chip.querySelector(".pz-count").textContent = formatCount(statusCounts[key] || 0);
    });
    document.querySelectorAll("#plznito-filter-category .pz-cat").forEach(function (row) {
      const key = row.dataset.categoryKey;
      const count = categoryCounts[key] || 0;
      row.querySelector("input").checked = state.categories.has(key);
      row.querySelector(".pz-count").textContent = formatCount(count);
      row.classList.toggle("pz-zero", count === 0);
    });

    document.getElementById("plznito-filter-count").innerHTML =
      "Zobrazeno <strong>" + formatCount(shownCount) + "</strong> z " + formatCount(CONFIG.markers.length) + " hlášení";
    document.getElementById("plznito-pill-count").textContent = formatCount(shownCount);
    const isDefault = state.time === CONFIG.defaultTimeFilter && sameSet(state.statuses, allStatusKeys) &&
      sameSet(state.categories, allCategoryKeys);
    document.getElementById("plznito-filter-reset").disabled = isDefault;

    // Empty state: offer the most useful way out.
    const empty = document.getElementById("plznito-empty");
    const action = document.getElementById("plznito-empty-action");
    empty.hidden = shownCount > 0;
    if (shownCount === 0) {
      const widenPeriod = inPeriod === 0 && state.time !== "last_365_days" && state.time !== "all_time";
      action.textContent = widenPeriod ? "Zobrazit poslední rok" : "Zrušit filtry";
      action.onclick = widenPeriod
        ? function () { state.time = "last_365_days"; applyFilters(); }
        : resetFilters;
    }
  }

  function resetFilters() {
    state.time = CONFIG.defaultTimeFilter;
    state.statuses = new Set(allStatusKeys);
    state.categories = new Set(allCategoryKeys);
    applyFilters();
  }

  // ── Shareable state in the URL hash: #t=30d&s=2,3&c=id:4&id=49965 ─────────
  let lastWrittenHash = null;
  function writeHash() {
    const params = new URLSearchParams();
    if (state.time !== CONFIG.defaultTimeFilter) {
      params.set("t", HASH_PERIODS[state.time] || state.time.replace("year:", ""));
    }
    if (!sameSet(state.statuses, allStatusKeys)) params.set("s", Array.from(state.statuses).join(","));
    if (!sameSet(state.categories, allCategoryKeys)) params.set("c", Array.from(state.categories).join(","));
    if (state.openId !== null) params.set("id", state.openId);
    const hash = params.toString();
    lastWrittenHash = hash;
    const url = window.location.pathname + window.location.search + (hash ? "#" + hash : "");
    try {
      window.history.replaceState(null, "", url);
    } catch (error) {
      // Sandboxed iframes may forbid history changes; the map works without them.
    }
  }

  function readHash() {
    const params = new URLSearchParams(window.location.hash.slice(1));
    const t = params.get("t");
    state.time = !t ? CONFIG.defaultTimeFilter : PERIOD_FROM_HASH[t] || (/^\d{4}$/.test(t) ? "year:" + t : CONFIG.defaultTimeFilter);
    state.statuses = params.has("s")
      ? new Set(params.get("s").split(",").filter(function (key) { return allStatusKeys.indexOf(key) >= 0; }))
      : new Set(allStatusKeys);
    state.categories = params.has("c")
      ? new Set(params.get("c").split(",").filter(function (key) { return allCategoryKeys.indexOf(key) >= 0; }))
      : new Set(allCategoryKeys);
    return params.get("id");
  }

  function openTicket(id) {
    const entry = entriesById.get(String(id));
    if (!entry) return;
    if (!displayLayer.hasLayer(entry.markerObj)) {
      // A shared link must show its ticket even if the filters would hide it.
      state.time = "all_time";
      state.statuses.add(String(entry.marker.status_id));
      state.categories.add(entry.marker.category_key);
      applyFilters();
    }
    const open = function () { entry.markerObj.openPopup(); };
    if (displayLayer.zoomToShowLayer) {
      clusterReady.then(function () { displayLayer.zoomToShowLayer(entry.markerObj, open); });
    } else {
      map.setView(entry.markerObj.getLatLng(), Math.max(map.getZoom(), 16));
      open();
    }
  }

  window.addEventListener("hashchange", function () {
    if (window.location.hash.slice(1) === lastWrittenHash) return;
    const id = readHash();
    applyFilters();
    if (id) openTicket(id);
  });

  // ── Panel / bottom sheet ───────────────────────────────────────────────────
  function setPanelOpen(open) {
    app.classList.toggle("pz-panel-closed", !open);
    document.getElementById("plznito-panel-open").setAttribute("aria-expanded", String(open));
    if (open) {
      document.getElementById("plznito-panel-close").focus();
    }
  }
  document.getElementById("plznito-panel-open").addEventListener("click", function () { setPanelOpen(true); });
  document.getElementById("plznito-panel-close").addEventListener("click", function () {
    setPanelOpen(false);
    document.getElementById("plznito-panel-open").focus();
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && phoneQuery.matches && !app.classList.contains("pz-panel-closed")) {
      setPanelOpen(false);
      document.getElementById("plznito-panel-open").focus();
    }
  });
  // Phones start with the map; desktops with the panel open.
  app.classList.toggle("pz-panel-closed", phoneQuery.matches);
  document.getElementById("plznito-panel-open").setAttribute("aria-expanded", String(!phoneQuery.matches));

  document.getElementById("plznito-category-all").addEventListener("click", function () {
    state.categories = new Set(allCategoryKeys);
    applyFilters();
  });
  document.getElementById("plznito-category-none").addEventListener("click", function () {
    state.categories = new Set();
    applyFilters();
  });
  document.getElementById("plznito-filter-reset").addEventListener("click", resetFilters);

  // Data timestamp for the page header (if the page has one).
  const updated = document.getElementById("plznito-updated");
  if (updated) {
    const date = new Date(CONFIG.generatedTs * 1000);
    updated.textContent = "aktualizováno " + date.toLocaleString("cs-CZ", {
      day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit"
    });
    updated.dateTime = date.toISOString();
  }

  buildYearSelect();
  buildStatusChips();
  buildCategoryList();
  const initialId = readHash();
  applyFilters();
  if (initialId) openTicket(initialId);
})();
</script>
